<!DOCTYPE html>
<!-- saved from url=(0045)https://rohitashokkhot.github.io/mediaplayer/ -->
<html lang="en" data-qb-installed="true"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- add the font family of your choice -->
    <link rel="stylesheet" href="files\reset.css">
    <link rel="stylesheet" href="files\style.css">
    <script src="files\script.js" defer=""></script>
  </head>
  <!--I have used the help of chatgpt to understand and learn to use some JavaScript functions, how to fix some codes that were not working, and how to implement them -->
  <!--I have taken the videos for the mediaplayer from the 'pixabay' website-->
  <!--I have taken the audiofiles for the mediaplayer from the Youtube audiolibrary-->
  <body>
    <!-- Header Section -->
    <header>
      <!--I added a logo to give the website a unique identity -->
      <img src="files\images\lofilogo.jpg" alt="Logo" class="logo" style="float: center;">
      <h1><i>MIDNIGHT STUDY</i></h1>
    </header>

    <!-- Navigation Section -->
    <nav>
      <!-- I have added a navigation bar to make the website appear more organized and structured-->
      <ul>
        <li><button onclick= "showPage('home')">Home</button></li>
        <li><button onclick= "showPage('playlists')">Playlists</button></li>
        <li><button onclick= "showPage('settings')">Settings</button></li>
        
      </ul>
    </nav>

    <!-- Main Content Section -->
    <main class="container">
      <!-- Media Player Section -->
       <!--I have added a media player so that the user gets a pleasant experiance when they are viewing the content on the website -->
       <!--The media player will swich videos everytime the user changes the mode, this would give the user more interaction  with the website-->
       <!--Along with the video, the audio will also change based on the selected mode, this will also give the user a more immersive experience -->
      <div class="media-player">
        <video id="custom-video-player">
          <source id="video-source" src="files\video\midnight.mp4" type="video/mp4">
        </video>

        <audio id="mode-audio">
    <source id="audio-source" src="files\audio\midnight_music.mp3" type="audio/mpeg">
        </audio>

        <!--The play pause button will help the user control what they are watching-->
        <div class="custom-controls">
          <button id="play-pause-btn" onclick="togglePlayPause()">
            <img id="play-pause-img" src="files\images\play--v1.png" alt="Play Button" width="24" height="24">
          </button>

          <!-- add the missing buttons or functionality here -->
           <!--The progress bar will show the user how much of the video has been played-->
          <div class="progress-bar">
            <span id="progress-bar-fill"></span>
          </div>
          <div>
            <img id="repeat" src="files\images\icons8-repeat-30.png"alt="Repeat button"  width="24" height="24">
          </div>
          <!--The volume control button will give more interactivity for the user to engage in the website-->
          <div class = "volume-control">
          <label for = "volume">🔊</label>
          <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
          </div>
        </div>
      </div>
      <br>
      <!-- Additional Content Section -->
       <!--This section will allow the user to choose their preferred atmosphere -->
       <!--The buttons will allow the user to switch between different modes and experience different atmospheres -->
       <!--I have incooperated three different modes besides the main mode which is the home mode-->
       <!--The three other modes are Nature mode, Study mode, and Creative mode-->
       <!--Each of these modes will provide a unique colour theme as well as a unique video andaudio experience-->
      <section class="modes">
    
        <!-- Add more content as needed -->
         <h1 style = "text-align: center; color: white;"><b>Choose your Atmosphere</b></h1>
         
         <!--I have added the nature mode for users who want to experience a more relaxing feeling or tranquility -->
    <button onclick="showPage('nature')">Nature mode</button>
    <br>
    <!--I have added the study mode for users who want to focus and study in a more productive environment -->
    <button onclick="showPage('study')">Focus and Study mode</button>
    <br>
    <!--I have added the creative mode for users who want to unleash their creativity and be more inspired while in their creative process -->
    <button onclick="showPage('creative')">Creative mode</button><br>
      </section>
    </main>

    <!-- Footer Section -->
    <footer>
      <p>© 2026 Media Player Website. All rights reserved.</p>
    </footer>
  
</body>
</html>
